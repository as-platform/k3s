apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations: 
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: "Project with apps templates"
  sourceRepos: 
    - https://github.com/as-platform/k3s
    - zot.homelab/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace