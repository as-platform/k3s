apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations: 
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: "Project with apps templates"
  sourceRepos: 
    - https://github.com/as-platform/k3s
    - zot.homelab/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
    - server: '*'
      namespace: '!kube-*'
    - server: '*'
      namespace: '!argocd'
    - server: '*'
      namespace: '!sealed-secrets'
    - server: '*'
      namespace: '!metallb'
    - server: '*'
      namespace: '!traefik'
    - server: '*'
      namespace: '!cert-manager'
    - server: '*'
      namespace: '!zot'
    - server: '*'
      namespace: '!keda'
    - server: '*'
      namespace: '!github-runner'
    - server: '*'
      namespace: '!monitoring'
    - server: '*'
      namespace: '!backstage'
    - server: '*'
      namespace: '!postgres'
    - server: '*'
      namespace: '!kyverno'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace