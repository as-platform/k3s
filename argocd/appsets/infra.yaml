apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: infra
  namespace: argocd
  annotations: 
    argocd.argoproj.io/sync-wave: "1"

spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/as-platform/k3s
        revision: main
        directories: 
          - path: infra/*
  template:
    metadata:
      name: "{{.path.basename}}"
    spec:
      project: infra
      source:
        repoURL: https://github.com/as-platform/k3s
        targetRevision: main
        path: "{{.path.path}}"
      destination: 
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions: [CreateNamespace=true]