zot:
  persistence: true
  pvc:
    storage: 50Gi
  service:
    type: ClusterIP
  mountConfig: true
  configFiles:
    config.json: |-
      {
        "storage": {
          "rootDirectory": "/var/lib/registry",
          "gc": true,
          "dedupe": true
        },
        "http": {
          "address": "0.0.0.0",
          "port": "5000",
          "auth": {
            "htpasswd": {
              "path": "/secrets/htpasswd"
            }
          },
          "accessControl": {
            "repositories": {
              "**": {
                "policies": [
                  {
                    "users": [
                      "admin"
                    ],
                    "actions": [
                      "read",
                      "create",
                      "update"
                    ]
                  }
                ],
                "defaultPolicy": []
              }
            },
            "adminPolicy": {
              "users": [
                "admin"
              ],
              "actions": [
                "read",
                "create",
                "update",
                "delete"
              ]
            }
          }
        },
        "log": {
          "level": "info"
        },
        "extensions": {
          "search": {
            "enable": true
          },
          "ui": {
            "enable": true
          },
          "trust": {
            "enable": true,
            "cosign": true
          }
        }
      }
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    hosts:
      - host: zot.homelab
        paths:
          - path: /
    tls:
      - secretName: zot-tls
        hosts:
          - zot.homelab
  externalSecrets:
    - secretName: zot-htpasswd
      mountPath: /secrets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi