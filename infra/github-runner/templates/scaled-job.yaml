apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: github-runner
  namespace: github-runner
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 3
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTargetRef:
    backoffLimit: 0
    activeDeadlineSeconds: 7200
    template:
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        hostAliases:
          - ip: 192.168.1.50
            hostnames: [zot.homelab]
        volumes:
          - name: homelab-ca
            configMap:
              name: homelab-ca
          - name: buildah-storage
            emptyDir:
              sizeLimit: 20Gi
        containers:
          - name: runner
            image: zot.homelab/golden/github-runner:stable
            imagePullPolicy: Always
            env:
              - name: GITHUB_ORG
                value: as-platform
              - name: RUNNER_LABELS
                value: homelab
              - name: SSL_CERT_DIR
                value: /etc/homelab-ca:/etc/ssl/certs
              - name: STORAGE_DRIVER
                value: overlay
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-runner-token
                    key: GITHUB_TOKEN
            volumeMounts:
              - name: homelab-ca
                mountPath: /etc/containers/certs.d/zot.homelab
                readOnly: true
              - name: homelab-ca
                mountPath: /etc/homelab-ca
                readOnly: true
              - name: buildah-storage
                mountPath: /home/runner/.local/share/containers
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 4Gi
            securityContext:
              seccompProfile: {type: Unconfined}
              appArmorProfile: {type: Unconfined}
  triggers:
    - type: github-runner
      authenticationRef:
        name: github-runner
      metadata:
        owner: "as-platform"
        runnerScope: "org"
        labels: "homelab"
        targetWorkflowQueueLength: "1"
        enableEtags: "true"
