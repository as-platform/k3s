argo-cd:
  global:
    domain: argocd.homelab
  configs:
    params:
      server.insecure: true

    rbac:
      policy.default: role:readonly
      policy.csv: |
        p, role:admin, *, *, *, allow
        g, admin, role:admin

  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  controller:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi

  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      tls: true
      annotations: 
        cert-manager.io/cluster-issuer: homelab-ca
    replicas: 1
    service:
      type: NodePort
      nodePortHttps: 31000
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  applicationSet:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  redis:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  notifications:
    enabled: false

  dex:
    enabled: false

