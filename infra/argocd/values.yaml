argo-cd:
  global:
    domain: argocd.homelab
    hostAliases:
      - ip: 192.168.1.50
        hostnames: [zot.homelab]
  configs:
    tls:
      certificates:
        zot.homelab: |
          -----BEGIN CERTIFICATE-----
          MIIBbzCCARSgAwIBAgIUM9XPZRGVup9KeAOo8EEXZ2SwJxcwCgYIKoZIzj0EAwIw
          FTETMBEGA1UEAxMKaG9tZWxhYi1jYTAeFw0yNjEwMjUyMTI0NTFaFw0zNjEwMjIy
          MTI0NTFaMBUxEzARBgNVBAMTCmhvbWVsYWItY2EwWTATBgcqhkjOPQIBBggqhkjO
          PQMBBwNCAAQ7Kd2f+n1KncwbCuuVKKS1FJVAhU3foxDtmPog7TsAGVs23OPOuZ8N
          pfhvwg3vwgEdKs8CFdpx7VXd0d2xit14o0IwQDAOBgNVHQ8BAf8EBAMCAqQwDwYD
          VR0TAQH/BAUwAwEB/zAdBgNVHQ4EFgQU9dIdxu8IXI8st5X5e4vzzhK/bv4wCgYI
          KoZIzj0EAwIDSQAwRgIhAIQKetiL6PSaiA6gggR6eLEBXFnWmpPL0y/aJ9FPZNX7
          AiEAqd2oWCJuSzCQiJCGEHL3KuyWT+sQl0yAkVlk/ivSgok=
          -----END CERTIFICATE-----
    params:
      server.insecure: true

    rbac:
      policy.default: role:readonly
      policy.csv: |
        p, role:admin, *, *, *, allow
        g, admin, role:admin

  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi

  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    ingress:
      enabled: true
      ingressClassName: traefik
      tls: true
      annotations: 
        cert-manager.io/cluster-issuer: homelab-ca
    replicas: 1
    service:
      type: NodePort
      nodePortHttps: 31000
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  redis:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  notifications:
    enabled: false

  dex:
    enabled: false

