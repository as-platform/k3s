argo-cd:
  configs:
    cm:
      accounts.ci-pipeline: apiKey
    rbac:
      policy.default: role:readonly
      policy.csv: |
        p, role:admin, *, *, *, allow
        g, admin, role:admin
        g, ci-pipeline, role:ci-pipeline

  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  controller:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi

  server:
    replicas: 1
    server:
    service:
      type: NodePort
      nodePortHttps: 31000
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  applicationSet:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  redis:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  notifications:
    enabled: false

  dex:
    enabled: false

